version: '3.8'

services:
  backend:
    build: ../Backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENVIRONMENT=prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    depends_on:
      - redis
  
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
  
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ../Backend/staticfiles:/var/www/static
      - ../Backend/media:/var/www/media
    depends_on:
      - backend

volumes:
  redis_data: